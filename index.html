<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 전문 스마트 견적 시스템</title>
    <!-- CSS 생략 (이전과 동일) -->
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; --border-color: #cbd5e1; --text-main: #1e293b; --text-muted: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); padding: 30px; display: flex; justify-content: center; }
        .app-wrapper { width: 100%; max-width: 1250px; position: relative; }
        .bookmark-tabs { display: flex; flex-direction: column; gap: 8px; position: absolute; left: -150px; top: 20px; width: 140px; }
        .tab-btn { padding: 12px 16px; background: #94a3b8; color: #ffffff; font-weight: 700; font-size: 13px; border: none; border-top-left-radius: 8px; border-bottom-left-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s; }
        .tab-btn.active { background: #ffffff; color: var(--primary-accent); border-left: 4px solid var(--primary-accent); }
        .container { background: #ffffff; border-radius: 12px; padding: 40px; }
        .page-section { display: none; }
        .page-section.active-page { display: block; }
        .header { border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .site-info-box { background: #f8fafc; border: 1px solid var(--border-color); padding: 25px; margin-bottom: 25px; }
        .form-field { margin-bottom: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-success { background-color: #10b981; color: white; }
        .items-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .items-table th { background: #f1f5f9; padding: 10px; border-bottom: 2px solid #cbd5e1; }
        .items-table td { padding: 10px; border-bottom: 1px solid #cbd5e1; }
        .input-qty, .input-price { width: 80px; padding: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="bookmark-tabs">
        <button class="tab-btn active" id="tabSite" onclick="switchPage('site')">📐 현장 정보</button>
        <button class="tab-btn" id="tabQuote" onclick="switchPage('quote')">📄 견적서 작성</button>
    </div>

    <div class="container">
        <!-- 1. 현장 정보 입력 페이지 -->
        <div class="page-section active-page" id="pageSite">
            <div class="header"><h1>현장 정보 설정</h1></div>
            <div class="site-info-box">
                <div class="form-field">
                    <label>보컬 인원 수 (3명 초과 시 모니터 스피커 증가)</label>
                    <input type="number" id="siteVocalCount" value="4" onchange="saveLocalData()">
                </div>
                <div class="form-field">
                    <label>옵션 설정</label>
                    <div style="display:flex; gap:20px;">
                        <label><input type="checkbox" id="chkMonitor" onchange="saveLocalData()" checked> 무대 모니터 스피커 사용</label>
                        <label><input type="checkbox" id="chkP16" onchange="saveLocalData()" checked> 퍼스널 믹서(P16) 사용</label>
                    </div>
                </div>
                <div class="form-field">
                    <label>퍼스널 믹서 필요 인원</label>
                    <input type="number" id="siteP16Count" value="5" onchange="saveLocalData()">
                </div>
                <button class="btn btn-success" onclick="generateSmartQuotation()">🤖 견적 자동 산출</button>
            </div>
        </div>

        <!-- 2. 견적서 페이지 -->
        <div class="page-section" id="pageQuote">
            <div class="header"><h1>견적서</h1></div>
            <table class="items-table">
                <thead>
                    <tr><th>No.</th><th>품목</th><th>브랜드 및 모델명</th><th>수량</th><th>단가(원)</th><th>합계(원)</th><th>삭제</th></tr>
                </thead>
                <tbody id="quotationItems"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let quoteItems = [];
    let productCatalog = {
        "C01": { cat: "믹서", brand: "Behringer", name: "WING", price: 3500000 },
        "C02": { cat: "I/O", brand: "Behringer", name: "DL32", price: 1200000 },
        "C03": { cat: "스피커", brand: "Audiocenter", name: "WM3210P", price: 1800000 },
        "C04": { cat: "스피커", brand: "Audiocenter", name: "UTA902DSP", price: 900000 },
        "C05": { cat: "무선마이크", brand: "Sennheiser", name: "EW-D / 835-S SET", price: 1100000 },
        "C06": { cat: "무선마이크", brand: "Sennheiser", name: "EW-D ASA", price: 450000 },
        "C07": { cat: "퍼스널믹서", brand: "Behringer", name: "P16-HQ", price: 350000 }
    };

    function addProductToQuote(prod, qty) {
        quoteItems.push({ cat: prod.cat, brand: prod.brand, name: prod.name, qty: qty, price: prod.price });
    }

    function generateSmartQuotation() {
        quoteItems = [];
        const vocalCount = parseInt(document.getElementById("siteVocalCount").value) || 0;
        const useMonitor = document.getElementById("chkMonitor").checked;
        const useP16 = document.getElementById("chkP16").checked;
        const p16Count = parseInt(document.getElementById("siteP16Count").value) || 0;

        // 믹서/IO
        addProductToQuote(productCatalog["C01"], 1);
        addProductToQuote(productCatalog["C02"], 1);

        // 메인 스피커
        addProductToQuote(productCatalog["C03"], 2);

        // 모니터 스피커 (로직: 사용안함=0, 사용=2 + (보컬 3명 초과 시 1개씩 증가))
        if (useMonitor) {
            let monitorCount = 2 + Math.floor(Math.max(0, vocalCount - 3) / 1); // 3명 초과 시부터 1개씩 추가
            addProductToQuote(productCatalog["C04"], monitorCount);
        }

        // 무선 마이크
        if (vocalCount > 0) {
            addProductToQuote(productCatalog["C05"], vocalCount);
            let asaCount = Math.ceil(vocalCount / 4);
            addProductToQuote(productCatalog["C06"], asaCount);
        }

        // 퍼스널 믹서
        if (useP16) {
            addProductToQuote(productCatalog["C07"], p16Count);
        }

        renderTable();
        alert("견적이 산출되었습니다.");
    }

    function renderTable() {
        const tbody = document.getElementById("quotationItems");
        tbody.innerHTML = quoteItems.map((item, i) => `
            <tr>
                <td>${i+1}</td><td>${item.cat}</td><td>[${item.brand}] ${item.name}</td>
                <td>${item.qty}</td><td>${item.price.toLocaleString()}</td>
                <td>${(item.qty * item.price).toLocaleString()}</td>
                <td><button onclick="quoteItems.splice(${i},1); renderTable();">✕</button></td>
            </tr>
        `).join('');
    }

    function saveLocalData() { /* 생략 */ }
    function loadLocalData() { /* 생략 */ }
    function switchPage(p) { /* 생략 */ }
</script>
</body>
</html>
