<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 전문 스마트 견적 시스템 (복구 완료)</title>
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; --border-color: #cbd5e1; --text-main: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); padding: 30px; display: flex; justify-content: center; }
        .app-wrapper { width: 100%; max-width: 1200px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .section { margin-bottom: 20px; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; background: #f8fafc; }
        label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 13px; color: var(--primary); }
        input, select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 10px; }
        .btn-action { background: var(--primary-accent); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 700; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f1f5f9; padding: 12px; border-bottom: 2px solid var(--border-color); text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .input-qty { width: 70px; padding: 4px; text-align: center; border: 1px solid #cbd5e1; }
        .input-price { width: 120px; padding: 4px; text-align: right; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="header"><h1>스마트 견적 자동 산출 시스템</h1></div>
    
    <div class="grid">
        <div class="section">
            <h3>현장 및 인원 설정</h3>
            <label>보컬 인원 수 (모니터 산출 기준)</label>
            <input type="number" id="siteVocalCount" value="4">
            
            <div style="display: flex; gap: 15px; margin: 15px 0;">
                <label><input type="checkbox" id="chkMonitor" checked> 모니터 사용</label>
                <label><input type="checkbox" id="chkP16" checked> P16 사용</label>
            </div>
            <label>퍼스널 믹서(P16) 수량</label>
            <input type="number" id="siteP16Count" value="6">
        </div>
        
        <div class="section">
            <h3>시스템 매칭 옵션</h3>
            <label>믹서 선호 브랜드</label>
            <select id="prefMixer"><option>Behringer</option><option>Yamaha</option><option>Midas</option></select>
            <label>스피커 선호 브랜드</label>
            <select id="prefSpeaker"><option>Audiocenter</option><option>Bose</option><option>JBL</option></select>
            <button class="btn-action" onclick="generateSmartQuotation()">견적 자동 산출하기</button>
        </div>
    </div>

    <table>
        <thead>
            <tr><th>No.</th><th>품목</th><th>브랜드 및 모델명</th><th>수량</th><th>단가(원)</th><th>합계(원)</th><th>삭제</th></tr>
        </thead>
        <tbody id="quoteBody"></tbody>
    </table>
</div>

<script>
    // 카탈로그 데이터 (서버 로드 실패 시 기본값)
    let productCatalog = {
        "mixer": { cat: "믹서", brand: "Behringer", name: "WING", price: 3500000 },
        "io": { cat: "I/O", brand: "Behringer", name: "DL32", price: 1200000 },
        "mainSpk": { cat: "스피커", brand: "Audiocenter", name: "WM3210P", price: 1800000 },
        "monSpk": { cat: "모니터", brand: "Audiocenter", name: "UTA902DSP", price: 900000 },
        "mic": { cat: "무선마이크", brand: "Sennheiser", name: "EW-D / 835-S", price: 1100000 },
        "asa": { cat: "분배기", brand: "Sennheiser", name: "EW-D ASA", price: 450000 },
        "p16": { cat: "퍼스널믹서", brand: "Behringer", name: "P16-HQ", price: 350000 }
    };
    let quoteItems = [];

    function generateSmartQuotation() {
        quoteItems = [];
        const vocal = parseInt(document.getElementById('siteVocalCount').value) || 0;
        const useMonitor = document.getElementById('chkMonitor').checked;
        const useP16 = document.getElementById('chkP16').checked;
        const p16Qty = parseInt(document.getElementById('siteP16Count').value) || 0;

        // 1. 믹서/IO
        addProduct(productCatalog.mixer, 1);
        addProduct(productCatalog.io, 1);

        // 2. 메인 스피커
        addProduct(productCatalog.mainSpk, 2);

        // 3. 모니터 스피커 (사용시: 2대 + 보컬 3명 초과 시 1개씩 추가)
        if (useMonitor) {
            let monitorQty = (vocal > 3) ? (2 + (vocal - 3)) : 2;
            addProduct(productCatalog.monSpk, monitorQty);
        }

        // 4. 무선마이크/분배기
        if (vocal > 0) {
            addProduct(productCatalog.mic, vocal);
            addProduct(productCatalog.asa, Math.ceil(vocal / 4));
        }

        // 5. 퍼스널믹서
        if (useP16) addProduct(productCatalog.p16, p16Qty);

        render();
    }

    function addProduct(prod, qty) {
        quoteItems.push({ ...prod, qty: qty });
    }

    function render() {
        const body = document.getElementById('quoteBody');
        body.innerHTML = quoteItems.map((item, i) => `
            <tr>
                <td>${i+1}</td>
                <td>${item.cat}</td>
                <td>[${item.brand}] ${item.name}</td>
                <td><input type="number" class="input-qty" value="${item.qty}" onchange="updateRow(${i}, this.value)"></td>
                <td>${item.price.toLocaleString()}</td>
                <td>${(item.qty * item.price).toLocaleString()}</td>
                <td><button onclick="quoteItems.splice(${i},1); render();">✕</button></td>
            </tr>
        `).join('');
    }

    function updateRow(i, qty) {
        quoteItems[i].qty = parseInt(qty);
        render();
    }
</script>
</body>
</html>
