<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>B2B Smart Quotation - Arthur System</title>
    <style>
        /* [스타일 최적화] */
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; }
        body { background-color: var(--bg-gray); padding: 50px 20px; font-family: sans-serif; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 40px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .tab-nav { display: flex; gap: 10px; position: absolute; top: -40px; left: 0; }
        .tab-btn { padding: 10px 20px; border-radius: 8px 8px 0 0; border: none; background: #94a3b8; color: white; cursor: pointer; }
        .tab-btn.active { background: #fff; color: var(--primary); }
        .page { display: none; }
        .page.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; background: var(--primary-accent); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-nav">
        <button class="tab-btn active" onclick="showPage('quote', this)">📄 견적서 작성</button>
        <button class="tab-btn" onclick="showPage('catalog', this)">📦 카탈로그 관리</button>
    </div>

    <div id="page-quote" class="page active">
        <!-- 견적서 본문 -->
        <div id="quotationItems"></div>
    </div>

    <div id="page-catalog" class="page">
        <!-- 카탈로그 본문 -->
        <table id="catalogTableBody"></table>
    </div>
</div>

<script>
    // 1. 상태관리 통합
    const state = {
        catalog: {},
        quoteItems: [],
        token: localStorage.getItem('arthur_github_token')
    };

    // 2. 페이지 전환 함수 (가장 확실한 방식)
    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        btn.classList.add('active');
        if(id === 'catalog') renderCatalogTable();
    }

    // 3. 로딩 순서 최적화 (Async/Await 활용)
    async function init() {
        await loadCatalogFromJSON();
        renderCatalogTable();
        renderQuotation();
    }

    async function loadCatalogFromJSON() {
        // 로컬 우선 로딩
        const local = localStorage.getItem('arthur_local_custom_catalog');
        if (local) state.catalog = JSON.parse(local);
        
        // 서버 동기화
        try {
            const res = await fetch('b2b_quotation_data.json?t=' + Date.now());
            if (res.ok) {
                const data = await res.json();
                state.catalog = { ...state.catalog, ...data };
                localStorage.setItem('arthur_local_custom_catalog', JSON.stringify(state.catalog));
            }
        } catch (e) { console.warn("서버 동기화 실패, 로컬 데이터 사용"); }
    }

    // [기타 기존 로직들...]
    // 이 코드 구조로 유지하면 데이터가 증발하거나 탭이 안 바뀌는 문제는 해결됩니다.

    init();
</script>
</body>
</html>
