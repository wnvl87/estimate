<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Professional Audio Quoting System</title>
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; --border-color: #cbd5e1; --text-main: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); padding: 30px; display: flex; justify-content: center; }
        .app-wrapper { width: 100%; max-width: 1200px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .section { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 10px; }
        .btn-action { background: var(--primary-accent); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid var(--border-color); text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .input-mini { width: 70px; padding: 4px; text-align: center; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="header"><h1>오디오 시스템 견적 솔루션</h1></div>
    
    <div class="grid">
        <div class="section">
            <h3>현장 및 인원 설정</h3>
            <label>보컬 인원 수 (모니터 산출 기준)</label>
            <input type="number" id="siteVocalCount" value="4">
            
            <label>악기 구성 (연주자 총 인원)</label>
            <input type="number" id="siteInstCount" value="3" placeholder="연주자 총 인원수">
            
            <div style="display: flex; gap: 10px;">
                <label><input type="checkbox" id="useMonitor" checked> 모니터 사용</label>
                <label><input type="checkbox" id="useP16" checked> P16 사용</label>
            </div>
            <label>퍼스널 믹서 인원</label>
            <input type="number" id="siteP16Count" value="5">
        </div>
        
        <div class="section">
            <h3>시스템 옵션</h3>
            <label>믹서 선호 브랜드</label>
            <select id="prefMixer"><option>Behringer</option><option>Yamaha</option><option>Midas</option></select>
            <label>스피커 선호 브랜드</label>
            <select id="prefSpeaker"><option>Audiocenter</option><option>Bose</option><option>JBL</option></select>
            <button class="btn-action" onclick="generateQuote()">견적 자동 산출하기</button>
        </div>
    </div>

    <table>
        <thead>
            <tr><th>No.</th><th>품목</th><th>브랜드 및 모델명</th><th>수량</th><th>단가(원)</th><th>합계(원)</th><th>삭제</th></tr>
        </thead>
        <tbody id="quoteBody"></tbody>
    </table>
</div>

<script>
    const catalog = {
        "mixer": { brand: "Behringer", name: "WING", price: 3500000, cat: "믹서" },
        "io": { brand: "Behringer", name: "DL32", price: 1200000, cat: "I/O" },
        "mainSpk": { brand: "Audiocenter", name: "WM3210P", price: 1800000, cat: "스피커" },
        "monSpk": { brand: "Audiocenter", name: "UTA902DSP", price: 900000, cat: "모니터" },
        "mic": { brand: "Sennheiser", name: "EW-D / 835-S", price: 1100000, cat: "무선마이크" },
        "asa": { brand: "Sennheiser", name: "EW-D ASA", price: 450000, cat: "분배기" },
        "p16": { brand: "Behringer", name: "P16-HQ", price: 350000, cat: "퍼스널믹서" },
        "cable": { brand: "Canare", name: "L-2T2S (m)", price: 2500, cat: "케이블" }
    };

    let quoteItems = [];

    function generateQuote() {
        quoteItems = [];
        const vocal = parseInt(document.getElementById('siteVocalCount').value) || 0;
        const inst = parseInt(document.getElementById('siteInstCount').value) || 0;
        const useMonitor = document.getElementById('useMonitor').checked;
        const useP16 = document.getElementById('useP16').checked;
        const p16Qty = parseInt(document.getElementById('siteP16Count').value) || 0;

        // 1. 믹서/IO
        quoteItems.push({ ...catalog.mixer, qty: 1 });
        quoteItems.push({ ...catalog.io, qty: 1 });

        // 2. 메인 스피커 (2대)
        quoteItems.push({ ...catalog.mainSpk, qty: 2 });

        // 3. 모니터 (기본 2 + 보컬 3명 초과 시 1개씩 추가)
        if (useMonitor) {
            let monitorQty = 2 + Math.floor(Math.max(0, vocal - 3) / 1);
            quoteItems.push({ ...catalog.monSpk, qty: monitorQty });
        }

        // 4. 무선/분배기
        if (vocal > 0) {
            quoteItems.push({ ...catalog.mic, qty: vocal });
            quoteItems.push({ ...catalog.asa, qty: Math.ceil(vocal / 4) });
        }

        // 5. P16
        if (useP16) quoteItems.push({ ...catalog.p16, qty: p16Qty });

        // 6. 케이블 (50m 단위)
        quoteItems.push({ ...catalog.cable, qty: 150 });

        render();
    }

    function render() {
        const body = document.getElementById('quoteBody');
        body.innerHTML = quoteItems.map((item, i) => `
            <tr>
                <td>${i+1}</td>
                <td>${item.cat}</td>
                <td>[${item.brand}] ${item.name}</td>
                <td><input type="number" class="input-mini" value="${item.qty}"></td>
                <td>${item.price.toLocaleString()}</td>
                <td>${(item.qty * item.price).toLocaleString()}</td>
                <td><button onclick="quoteItems.splice(${i},1); render();">✕</button></td>
            </tr>
        `).join('');
    }
</script>
</body>
</html>
