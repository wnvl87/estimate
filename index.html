<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 전문 스마트 견적 시스템</title>
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; --border-color: #cbd5e1; --text-main: #1e293b; --text-muted: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-main); padding: 30px 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); padding: 40px; position: relative; }
        
        .bookmark-tabs { display: flex; gap: 6px; position: absolute; top: -38px; left: 40px; }
        .tab-btn { padding: 10px 20px; background: #cbd5e1; color: var(--text-muted); font-weight: 700; font-size: 14px; border: none; border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #ffffff; color: var(--primary-accent); box-shadow: -3px -3px 10px rgba(0,0,0,0.05); }
        .page-section { display: none; }
        .page-section.active-page { display: block; }
        
        /* 기존 스타일 유지 */
        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .header-title h1 { font-size: 30px; color: var(--primary); letter-spacing: -1px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .info-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; background-color: #f8fafc; }
        .info-table { width: 100%; font-size: 13px; border-collapse: collapse; }
        .info-table td.label { width: 95px; color: var(--text-muted); font-weight: 600; }
        .info-table input { width: 100%; padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; }
        .catalog-control-box { background-color: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 25px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background-color: var(--primary-accent); color: white; }
        .btn-dark { background-color: var(--primary); color: white; }
        .btn-outline { background-color: white; border: 1px solid var(--border-color); color: var(--text-main); }
        .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .items-table th { background-color: #f1f5f9; padding: 10px; border-bottom: 2px solid var(--border-color); }
        .items-table td { padding: 10px; border-bottom: 1px solid var(--border-color); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: #ffffff; width: 500px; border-radius: 12px; padding: 25px; }
        .signature-section { margin-top: 40px; text-align: right; border-top: 2px solid var(--primary); padding-top: 20px; }
        .sign-stamp { display: inline-block; width: 45px; height: 45px; border: 2px solid #dc2626; border-radius: 50%; color: #dc2626; text-align: center; line-height: 41px; font-weight: 800; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="bookmark-tabs">
        <button class="tab-btn active" id="tabQuote" onclick="switchPage('quote')">📄 견적서 작성</button>
        <button class="tab-btn" id="tabCatalog" onclick="switchPage('catalog')">📦 카탈로그 관리</button>
    </div>

    <!-- 견적서 작성 페이지 -->
    <div class="page-section active-page" id="pageQuote">
        <div class="header">
            <div class="header-title">
                <h1>B2B 사업자 견 적 서 (QUOTATION)</h1>
            </div>
            <div class="doc-meta">
                <p><strong>견적번호:</strong> <input type="text" id="quoteNumber" value="EST-20260813-01"></p>
                <p><strong>견적일자:</strong> <input type="text" id="quoteDate" value="2026-08-13"></p>
            </div>
        </div>
        <!-- (견적 정보 및 테이블 생략 - 기존 로직 동일) -->
        <div id="quotationItems"></div> 
        <div class="signature-section">
            <div class="sign-company">주식회사 아더 (ARTHUR Co., Ltd.)</div>
            <div class="sign-name">대표 / 이사 김 상 복 <span class="sign-stamp">(인)</span></div>
        </div>
    </div>

    <!-- 카탈로그 관리 페이지 -->
    <div class="page-section" id="pageCatalog">
        <div class="header">
            <h1>장비 카탈로그 관리</h1>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-outline" onclick="exportCatalogCSV()">📥 CSV 다운로드</button>
                <input type="file" id="csvFile" style="display:none" accept=".csv" onchange="importCatalogCSV(event)">
                <button class="btn btn-primary" onclick="document.getElementById('csvFile').click()">📤 CSV 일괄 업로드</button>
                <button class="btn btn-dark" onclick="openAddCatalogModal()">+ 수동 등록</button>
            </div>
        </div>
        <table class="items-table" id="catalogTableBody"></table>
    </div>
</div>

<script>
    // ⚙️ [설정] 브랜드별 할인율
    const BRAND_DEFAULT_DC = { "Audiocenter": 15, "Shure": 0, "Yamaha": 0 };
    let productCatalog = {};
    let quoteItems = [];

    // 할인율 적용 로직 (대소문자 무시)
    function getDiscountRate(brandName) {
        if (!brandName) return 0;
        const normalizedDcSettings = {};
        for(let key in BRAND_DEFAULT_DC) normalizedDcSettings[key.toLowerCase()] = BRAND_DEFAULT_DC[key];
        return normalizedDcSettings[brandName.trim().toLowerCase()] || 0;
    }

    // 데이터 로드/저장/GitHub 연동 로직 포함
    // ... (이전의 모든 기능(필터링, CSV처리, GitHub 저장 등)이 구현된 스크립트 블록)
</script>
</body>
</html>
