<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 스마트 견적 시스템 (Arthur Co.)</title>
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; --border-color: #cbd5e1; --text-main: #1e293b; --text-muted: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-main); padding: 50px 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); padding: 40px; position: relative; }

        /* 탭 메뉴 */
        .bookmark-tabs { display: flex; gap: 6px; position: absolute; top: -38px; left: 40px; }
        .tab-btn { padding: 10px 20px; background: #cbd5e1; color: var(--text-muted); font-weight: 700; border: none; border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #ffffff; color: var(--primary-accent); }
        .page-section { display: none; }
        .page-section.active-page { display: block; }

        /* 견적서 스타일 */
        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .info-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; background-color: #f8fafc; }
        .info-table { width: 100%; font-size: 13px; border-collapse: collapse; }
        .info-table td.label { width: 95px; color: var(--text-muted); font-weight: 600; }
        .info-table input { width: 100%; padding: 4px; border: 1px solid var(--border-color); outline: none; }
        
        .table-wrapper { overflow-x: auto; margin: 20px 0; }
        .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .items-table th { background: #f1f5f9; padding: 10px; border-bottom: 2px solid var(--border-color); }
        .items-table td { padding: 10px; border-bottom: 1px solid var(--border-color); }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary-accent); color: white; }
        
        .signature-section { margin-top: 40px; text-align: right; border-top: 2px solid var(--primary); padding-top: 20px; }
        .sign-stamp { display: inline-block; width: 45px; height: 45px; border: 2px solid #dc2626; border-radius: 50%; text-align: center; line-height: 41px; font-weight: 800; color: #dc2626; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="bookmark-tabs">
        <button class="tab-btn active" id="tabQuote" onclick="switchPage('quote')">📄 견적서 작성</button>
        <button class="tab-btn" id="tabCatalog" onclick="switchPage('catalog')">📦 카탈로그 관리</button>
    </div>

    <!-- 견적서 페이지 -->
    <div class="page-section active-page" id="pageQuote">
        <div class="header">
            <div><h1>B2B 견적서</h1><p>Audiocenter & Pro Audio</p></div>
        </div>
        <div class="info-grid">
            <div class="info-card"><h3>공급자</h3><table class="info-table"><tr><td>주식회사 아더</td></tr><tr><td>최동주 이사 (010-9773-8904)</td></tr></table></div>
            <div class="info-card"><h3>수신자</h3><table class="info-table"><tr><td><input type="text" id="clientCompany" placeholder="업체명"></td></tr></table></div>
        </div>
        <div class="table-wrapper">
            <table class="items-table" id="quotationItems"></table>
        </div>
        <div class="signature-section">
            <div style="font-size: 20px; font-weight: 800;">주식회사 아더 (ARTHUR Co., Ltd.)</div>
            <div style="font-size: 16px; margin-top: 10px;">대표이사 김 상 복 <span class="sign-stamp">(인)</span></div>
        </div>
        <button class="btn btn-primary" onclick="window.print()">🖨️ 인쇄/PDF</button>
    </div>

    <!-- 카탈로그 관리 페이지 -->
    <div class="page-section" id="pageCatalog">
        <div class="header"><h1>장비 카탈로그 관리</h1></div>
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="exportCatalogCSV()">📥 다운로드</button>
            <input type="file" id="csvFile" style="display:none" onchange="importCatalogCSV(event)">
            <button class="btn btn-primary" onclick="document.getElementById('csvFile').click()">📤 일괄 업로드</button>
        </div>
        <table class="items-table" id="catalogTableBody"></table>
    </div>
</div>

<script>
    const BRAND_DEFAULT_DC = { "Audiocenter": 15, "Shure": 0, "Yamaha": 0 };
    let productCatalog = {};
    let quoteItems = [];

    // 페이지 초기화
    window.onload = async function() {
        await loadData();
        renderCatalogTable();
    };

    function switchPage(p) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active-page'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active-page');
        document.getElementById('tab' + p.charAt(0).toUpperCase() + p.slice(1)).classList.add('active');
    }

    // 데이터 로드 (로컬 우선)
    async function loadData() {
        const local = localStorage.getItem('arthur_local_custom_catalog');
        if (local) productCatalog = JSON.parse(local);
        
        try {
            const res = await fetch('b2b_quotation_data.json?t=' + Date.now());
            if (res.ok) {
                productCatalog = await res.json();
                localStorage.setItem('arthur_local_custom_catalog', JSON.stringify(productCatalog));
            }
        } catch (e) { console.error(e); }
    }

    // CSV 업로드
    function importCatalogCSV(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            lines.forEach((line, i) => {
                if (i === 0 || !line.trim()) return;
                const [cat, brand, name, price, specs] = line.split(',');
                const key = "CAT_" + Date.now() + i;
                productCatalog[key] = { cat, brand, name, price: parseInt(price), specs: {} };
            });
            localStorage.setItem('arthur_local_custom_catalog', JSON.stringify(productCatalog));
            alert("업로드 완료!");
            renderCatalogTable();
        };
        reader.readAsText(file);
    }

    // 카탈로그 렌더링
    function renderCatalogTable() {
        const tbody = document.getElementById('catalogTableBody');
        tbody.innerHTML = `<tr><th>품목</th><th>브랜드</th><th>모델</th><th>가격</th></tr>`;
        for (const [key, prod] of Object.entries(productCatalog)) {
            tbody.innerHTML += `<tr><td>${prod.cat}</td><td>${prod.brand}</td><td>${prod.name}</td><td>${prod.price.toLocaleString()}</td></tr>`;
        }
    }
</script>
</body>
</html>
