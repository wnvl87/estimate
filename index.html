<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>B2B Smart Quotation - Arthur System</title>
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: var(--bg-gray); padding: 30px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .tabs { display: flex; gap: 5px; position: absolute; top: -38px; left: 40px; }
        .tab-btn { padding: 10px 20px; border: none; cursor: pointer; background: #cbd5e1; border-radius: 8px 8px 0 0; font-weight: 700; }
        .tab-btn.active { background: #fff; color: var(--primary-accent); }
        .page { display: none; }
        .page.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; }
        .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary-accent); color: white; font-weight: 600; }
        @media print { .tabs, .btn, .catalog-control { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showPage('quote', this)">📄 견적서</button>
        <button class="tab-btn" onclick="showPage('catalog', this)">📦 카탈로그</button>
    </div>

    <!-- 견적서 페이지 -->
    <div id="page-quote" class="page active">
        <h1>B2B 견적서</h1>
        <table id="quoteTable"><thead><tr><th>모델명</th><th>수량</th><th>공급단가</th><th>합계</th></tr></thead><tbody></tbody></table>
        <div style="margin-top:40px; text-align:right;">대표이사 김 상 복 (인)</div>
        <button class="btn" onclick="window.print()">인쇄/PDF</button>
    </div>

    <!-- 카탈로그 페이지 -->
    <div id="page-catalog" class="page">
        <h1>카탈로그 관리</h1>
        <div class="catalog-control">
            <button class="btn" onclick="document.getElementById('csvFile').click()">📤 CSV 업로드</button>
            <input type="file" id="csvFile" style="display:none" onchange="importCSV(event)">
        </div>
        <table id="catalogTable"><thead><tr><th>품목</th><th>브랜드</th><th>모델명</th><th>가격</th></tr></thead><tbody></tbody></table>
    </div>
</div>

<script>
    const state = {
        catalog: JSON.parse(localStorage.getItem('myCatalog')) || {},
        brandDc: { "Audiocenter": 15, "Shure": 0, "Yamaha": 0 }
    };

    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        btn.classList.add('active');
        if(id === 'catalog') renderCatalog();
    }

    function renderCatalog() {
        const tbody = document.querySelector('#catalogTable tbody');
        tbody.innerHTML = Object.values(state.catalog).map(p => 
            `<tr><td>${p.cat}</td><td>${p.brand}</td><td>${p.name}</td><td>₩${parseInt(p.price).toLocaleString()}</td></tr>`
        ).join('');
    }

    function importCSV(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            event.target.result.split('\n').forEach((line, i) => {
                if(i === 0 || !line.trim()) return;
                const [cat, brand, name, price] = line.split(',');
                state.catalog['k_' + Date.now() + i] = { cat, brand, name, price: parseInt(price) };
            });
            localStorage.setItem('myCatalog', JSON.stringify(state.catalog));
            renderCatalog();
            alert("카탈로그 업데이트 완료");
        };
        reader.readAsText(e.target.files[0]);
    }
</script>
</body>
</html>
