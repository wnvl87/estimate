<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>B2B Smart Quotation - Arthur System</title>
    <style>
        :root { --primary: #0f172a; --primary-accent: #2563eb; --bg-gray: #f1f5f9; --border-color: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); padding: 50px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; background: #ffffff; border-radius: 12px; padding: 40px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .bookmark-tabs { display: flex; gap: 6px; position: absolute; top: -38px; left: 40px; }
        .tab-btn { padding: 10px 20px; background: #94a3b8; color: white; border: none; border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; font-weight: 700; }
        .tab-btn.active { background: #ffffff; color: var(--primary-accent); }
        .page-section { display: none; }
        .page-section.active-page { display: block; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
        th { background: #f1f5f9; padding: 12px; border-bottom: 2px solid var(--border-color); text-align: left; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; background: var(--primary-accent); color: white; }
        .sign-stamp { display: inline-block; width: 45px; height: 45px; border: 2px solid #dc2626; border-radius: 50%; color: #dc2626; text-align: center; line-height: 41px; font-weight: 800; margin-left: 10px; }
        @media print { .bookmark-tabs, .btn, .catalog-control { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="bookmark-tabs">
        <button class="tab-btn active" id="tabQuote" onclick="switchPage('quote')">📄 견적서 작성</button>
        <button class="tab-btn" id="tabCatalog" onclick="switchPage('catalog')">📦 카탈로그 관리</button>
    </div>

    <!-- 견적서 페이지 -->
    <div class="page-section active-page" id="page-quote">
        <div class="header"><h1>B2B 사업자 견 적 서 (QUOTATION)</h1></div>
        <table class="items-table" id="quotationItems"><thead><tr><th>No</th><th>품목</th><th>모델명</th><th>수량</th><th>단가</th><th>합계</th></tr></thead><tbody></tbody></table>
        <div class="signature-section" style="text-align:right; border-top:2px solid #000; padding-top:20px;">
            <div style="font-size: 18px; font-weight: 800;">주식회사 아더 (ARTHUR Co., Ltd.)</div>
            <div style="font-size: 16px; margin-top: 10px;">대표이사 김 상 복 <span class="sign-stamp">(인)</span></div>
        </div>
        <button class="btn" onclick="window.print()">🖨️ 인쇄/PDF</button>
    </div>

    <!-- 카탈로그 페이지 -->
    <div class="page-section" id="page-catalog">
        <div class="header"><h1>장비 카탈로그 관리</h1></div>
        <div class="catalog-control" style="margin-bottom:20px;">
            <button class="btn" onclick="document.getElementById('csvInput').click()">📤 일괄 업로드</button>
            <input type="file" id="csvInput" style="display:none" onchange="importCatalog(event)">
        </div>
        <table class="items-table" id="catalogTable"><thead><tr><th>품목</th><th>브랜드</th><th>모델명</th><th>가격</th></tr></thead><tbody></tbody></table>
    </div>
</div>

<script>
    const dcRates = { "Audiocenter": 15, "Shure": 0, "Yamaha": 0 };
    let catalog = JSON.parse(localStorage.getItem('myCatalog')) || {};

    function switchPage(p) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active-page'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active-page');
        document.getElementById('tab' + p.charAt(0).toUpperCase() + p.slice(1)).classList.add('active');
        if(p === 'catalog') renderCatalog();
    }

    function renderCatalog() {
        const tbody = document.querySelector('#catalogTable tbody');
        tbody.innerHTML = Object.values(catalog).map(p => 
            `<tr><td>${p.cat}</td><td>${p.brand}</td><td>${p.name}</td><td>₩${parseInt(p.price).toLocaleString()}</td></tr>`
        ).join('');
    }

    function importCatalog(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            event.target.result.split('\n').forEach((line, i) => {
                if(i === 0 || !line.trim()) return;
                const [cat, brand, name, price] = line.split(',');
                catalog["CAT_" + Date.now() + i] = { cat, brand, name, price: parseInt(price) };
            });
            localStorage.setItem('myCatalog', JSON.stringify(catalog));
            renderCatalog();
            alert("카탈로그가 성공적으로 반영되었습니다.");
        };
        reader.readAsText(file);
    }

    // 브랜드별 할인 자동 적용 함수
    function getDiscountedPrice(brand, msrp) {
        const rate = dcRates[Object.keys(dcRates).find(k => k.toLowerCase() === brand.toLowerCase())] || 0;
        return Math.round(msrp * (1 - rate / 100));
    }

    renderCatalog();
</script>
</body>
</html>
